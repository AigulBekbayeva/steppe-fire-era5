[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steppe-fire-era5"
version = "0.1.0"
description = "Retrospective steppe wildfire spread analysis from NASA FIRMS hotspots and ERA5 reanalysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["wildfire", "remote-sensing", "nasa-firms", "era5", "reanalysis", "gis", "kazakhstan"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "shapely>=2.0",
    "folium>=0.15",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
steppe-fire-era5 = "run:main"

[tool.setuptools]
packages = ["firms_spread"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
